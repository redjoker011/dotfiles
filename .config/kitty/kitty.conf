# https://yardoc.org/ ——————————————————————————————————————————————————————————————————————
# FONT CONFIGURATION
# ——————————————————————————————————————————————————————————————————————
font_family         Iosevka Custom
bold_font           auto
italic_font         auto
bold_italic_font    auto
font_size           12.5

# Modern way to adjust line height (adjust_line_height is deprecated)
modify_font cell_height 110%

# ——————————————————————————————————————————————————————————————————————
# WINDOW & LAYOUTS
# ——————————————————————————————————————————————————————————————————————
enabled_layouts     splits,stack
window_padding_width 4
hide_window_decorations yes
confirm_os_window_close 0

# Resize Windows
map ctrl+shift+n    resize_window narrower
map ctrl+shift+w    resize_window wider
map ctrl+shift+t    resize_window taller
map ctrl+shift+s    resize_window shorter 3
map ctrl+shift+x    close_window

# Zoom/Maximize a single split toggle (Great for small screens)
map ctrl+shift+z    toggle_layout stack

# ——————————————————————————————————————————————————————————————————————
# TAB BAR STYLE
# ——————————————————————————————————————————————————————————————————————
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_edge        top
active_tab_font_style   bold
inactive_tab_font_style normal

# ——————————————————————————————————————————————————————————————————————
# SCROLLBACK & PERFORMANCE
# ——————————————————————————————————————————————————————————————————————
scrollback_lines    10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 5.0

# Open scrollback buffer in Neovim/pager to search easily
map ctrl+shift+p    show_scrollback

# ——————————————————————————————————————————————————————————————————————
# SYSTEM & ENVIRONMENT
# ——————————————————————————————————————————————————————————————————————
env PATH=${PATH}:/opt/homebrew/bin

# Clipboard integration fix across multiplexers/ssh
clipboard_control write-clipboard write-primary read-clipboard read-primary

# ——————————————————————————————————————————————————————————————————————
# KEY BINDINGS & CONFIG MANAGEMENT
# ——————————————————————————————————————————————————————————————————————
# Debug (reload is kitty's default ctrl+cmd+,)
map ctrl+shift+d    debug_config

# ——————————————————————————————————————————————————————————————————————
# SESSIONS (one file per project in sessions/)
# ——————————————————————————————————————————————————————————————————————
startup_session     sessions/dotfiles.kitty-session
map ctrl+a>s        goto_session --sort-by=alphabetical ~/.config/kitty/sessions
map ctrl+a>a        goto_session -1
map ctrl+a>q        close_session

# Only show the active project's tabs (plus tabs outside any session)
tab_bar_filter      session:~ or session:^$

# New tabs/windows join the active project
map cmd+t           new_tab_with_cwd
map cmd+enter       new_window_with_cwd

# Quick tab navigation
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+1     goto_tab 1
map ctrl+shift+2     goto_tab 2
map ctrl+shift+3     goto_tab 3
map ctrl+shift+4     goto_tab 4
map ctrl+shift+5     goto_tab 5

# ——————————————————————————————————————————————————————————————————————
# INCLUDES & THEMES
# ——————————————————————————————————————————————————————————————————————
include splits.conf

# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf

# Cursor style and behavior
cursor #F8F8F2
cursor_text_color #282A36
cursor_shape block
cursor_blink_interval 0

# Cursor trail (Kitty >= 0.35.0)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
# END_KITTY_THEME
