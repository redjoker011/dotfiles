# ——————————————————————————————————————————————————————————————————————
# FONT CONFIGURATION
# ——————————————————————————————————————————————————————————————————————
font_family         Iosevka Custom
bold_font           auto
italic_font         auto
bold_italic_font    auto
font_size           12.5

# Modern way to adjust line height (adjust_line_height is deprecated)
modify_font line_height 110%

# ——————————————————————————————————————————————————————————————————————
# WINDOW & LAYOUTS
# ——————————————————————————————————————————————————————————————————————
enabled_layouts     splits,stack
window_padding_width 4
hide_window_decorations yes
confirm_os_window_close 0

# Resize Windows
map ctrl+shift+n    resize_window narrower
map ctrl+shift+w    resize_window wider
map ctrl+shift+t    resize_window taller
map ctrl+shift+s    resize_window shorter 3
map ctrl+shift+x    close_window

# Zoom/Maximize a single split toggle (Great for small screens)
map ctrl+shift+z    toggle_layout stack

# ——————————————————————————————————————————————————————————————————————
# TAB BAR STYLE
# ——————————————————————————————————————————————————————————————————————
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_edge        top
active_tab_font_style   bold
inactive_tab_font_style normal

# ——————————————————————————————————————————————————————————————————————
# SCROLLBACK & PERFORMANCE
# ——————————————————————————————————————————————————————————————————————
scrollback_lines    10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 5.0

# Open scrollback buffer in Neovim/pager to search easily
map ctrl+shift+p    show_scrollback

# ——————————————————————————————————————————————————————————————————————
# SYSTEM & ENVIRONMENT
# ——————————————————————————————————————————————————————————————————————
startup_session     session.conf
env PATH=${PATH}:/opt/homebrew/bin

# Allow kitty to be controlled remotely (required for many advanced scripts)
allow_remote_control yes
listen_on unix:/tmp/mykitty

# Clipboard integration fix across multiplexers/ssh
clipboard_control write-clipboard write-primary read-clipboard read-primary

# ——————————————————————————————————————————————————————————————————————
# KEY BINDINGS & CONFIG MANAGEMENT
# ——————————————————————————————————————————————————————————————————————
# Reload & Debug
map ctrl+r          load_config_file
map ctrl+shift+d    debug_config

# Quick tab navigation
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+1     goto_tab 1
map ctrl+shift+2     goto_tab 2
map ctrl+shift+3     goto_tab 3
map ctrl+shift+4     goto_tab 4
map ctrl+shift+5     goto_tab 5

# ——————————————————————————————————————————————————————————————————————
# INCLUDES & THEMES
# ——————————————————————————————————————————————————————————————————————
include splits.conf

# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf

# Cursor
cursor #F8F8F2
cursor_text_color #282A36

# Cursor trail
cursor_trail 3
cursor_trail_decay 0.08 0.30
cursor_trail_start_threshold 1
cursor_trail_color #BD93F9
# END_KITTY_THEME
